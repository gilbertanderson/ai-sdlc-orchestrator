[project]
name = "sdlc-orchestrator"
version = "0.1.0"
description = "Agentic SDLC automation: PR summaries, unit test generation and security scanning with LangGraph and AWS Bedrock."
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0",
  "langchain-core>=1.0",
  "langchain-aws>=1.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
sdlc-orchestrator = "sdlc_orchestrator.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sdlc_orchestrator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
